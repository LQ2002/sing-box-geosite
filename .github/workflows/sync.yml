name: Config Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# 只需要写 Releases 和 tag，不再往仓库推提交
permissions:
  contents: write

env:
  RELEASE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: "Setup sing-box"
      run: |
        set -Eeuo pipefail
        # 从 GitHub Releases API 获取最新 release 中的 linux_amd64 .deb 下载链接
        SING_BOX_DEB_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
          | grep "browser_download_url" | grep "linux_amd64.deb" | head -n1 | cut -d '"' -f4 || true)
        if [ -z "$SING_BOX_DEB_URL" ]; then
          echo "::error::没有从 sing-box 最新 release 里找到 linux_amd64 的 .deb"
          exit 1
        fi
        echo "Downloading $SING_BOX_DEB_URL"
        wget -O sing-box.deb "$SING_BOX_DEB_URL"
        sudo dpkg -i sing-box.deb

    - name: Set up Python3
      uses: actions/setup-python@v6
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    - name: Prepare directories
      run: mkdir -p ./rule/

    - name: Run script
      env:
        # 主程序把"本次应该产出哪些规则集"的清单写到这里，
        # 下一步据此判断要不要清理陈旧资产
        BUILD_REPORT: ${{ runner.temp }}/build-report.json
      run: python ../main.py
      working-directory: ./rule/

    - name: Sanity check generated files
      run: |
        set -Eeuo pipefail
        report="$RUNNER_TEMP/build-report.json"
        if [ ! -s "$report" ]; then
          echo "::error::主程序没有写出构建清单 $report"
          exit 1
        fi

        python3 .github/scripts/check_build.py "$report" ./rule "$RUNNER_TEMP/counts.txt"

        read -r expected actual < "$RUNNER_TEMP/counts.txt"
        ls -la ./rule/

        if [ "$actual" -eq 0 ]; then
          echo "::error::没有生成任何规则文件，中止发布"
          exit 1
        fi

        # 有上游挂掉时只上传、不做陈旧资产清理，避免把订阅中的 srs 删掉
        if [ "$actual" -lt "$expected" ]; then
          echo "::warning::只生成了 $actual/$expected 个规则，疑似上游源不可用；本次跳过陈旧资产清理"
          echo "PRUNE_STALE=false" >> "$GITHUB_ENV"
        else
          echo "PRUNE_STALE=true" >> "$GITHUB_ENV"
        fi

    - name: Publish to rolling release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail

        # 1. release 不存在则创建
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Rule sets (rolling)" \
            --notes "自动生成的 sing-box 规则集，每次构建覆盖。" \
            --latest
        fi

        # 2. 先上传新文件（--clobber 覆盖同名资产），保证链接不断流
        gh release upload "$RELEASE_TAG" ./rule/* --clobber

        # 3. 再删除本次没有生成的陈旧资产（links.txt 里已移除的规则）
        #    仅在本次生成完整时执行，否则上游临时故障会误删订阅中的资产
        if [ "${PRUNE_STALE:-false}" = "true" ]; then
          # 本地文件名要按 GitHub 的资产命名规则规整后再比对：上传时
          # [A-Za-z0-9._-] 之外的字符会被换成 '.'，拿本地原名直接比会对不上，
          # 于是把刚传上去的资产当成陈旧资产删掉。
          find ./rule -maxdepth 1 -type f -printf '%f\n' \
            | sed 's/[^A-Za-z0-9._-][^A-Za-z0-9._-]*/./g' \
            | sort > "$RUNNER_TEMP/current.txt"
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' \
            | sort > "$RUNNER_TEMP/remote.txt"
          comm -13 "$RUNNER_TEMP/current.txt" "$RUNNER_TEMP/remote.txt" > "$RUNNER_TEMP/stale.txt"
          while read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting stale asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done < "$RUNNER_TEMP/stale.txt"
        else
          echo "跳过陈旧资产清理"
        fi

        # 4. 把 latest 这个 tag 移到当前提交。
        #    release 页面上 tag 旁边显示的 commit 取自 tag 指向，
        #    创建之后不会自己跟着走，不移的话会一直停在创建时那个提交。
        git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
        git push -f origin "refs/tags/$RELEASE_TAG"

        # 5. 刷新发布说明里的时间戳
        #    注意：下面每一行都必须保持缩进，
        #    顶到第 0 列会提前终止 run: | 的块标量
        {
          echo "自动生成的 sing-box 规则集，每次构建覆盖。"
          echo
          # 用 UTC+8 算术偏移而不是 TZ=Asia/Shanghai：不依赖运行环境装了 tzdata，
          # 北京时间没有夏令时，偏移恒定
          echo "最后更新: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S') (北京时间 UTC+8)"
          echo "来源提交: $GITHUB_SHA"
        } > "$RUNNER_TEMP/notes.md"
        gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
