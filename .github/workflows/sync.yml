name: Config Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# 只需要写 Releases，不再往仓库推提交
permissions:
  contents: write

env:
  RELEASE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: "Setup sing-box"
      run: |
          set -Eeuo pipefail
          # 从 GitHub Releases API 获取最新 release 中的 linux_amd64 .deb 下载链接
          SING_BOX_DEB_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep "browser_download_url" | grep "linux_amd64.deb" | head -n1 | cut -d '"' -f4 || true)
          if [ -z "$SING_BOX_DEB_URL" ]; then
            echo "Failed to find sing-box linux_amd64 .deb URL from latest release"
            exit 1
          fi
          echo "Downloading $SING_BOX_DEB_URL"
          wget -O sing-box.deb "$SING_BOX_DEB_URL"
          sudo dpkg -i sing-box.deb

    - name: Set up Python3
      uses: actions/setup-python@v6
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    - name: Prepare directories
      run: mkdir -p ./rule/

    - name: Run script
      run: python ../main.py
      working-directory: ./rule/

    - name: Sanity check generated files
      run: |
        set -Eeuo pipefail
        # links.txt 里去重后的规则名数量 = 本次应该生成的 json 个数
        expected=$(awk '$1 !~ /^#/ && NF >= 2 { print $2 }' links.txt | sort -u | wc -l)

        # 只数 json 不够：srs 编译失败时 json 仍在，
        # 陈旧资产清理会把 Release 上那份还能用的 srs 删掉。
        # 必须 json 和 srs 成对存在才算这条规则生成成功。
        actual=0
        for json in ./rule/*.json; do
          [ -e "$json" ] || continue
          if [ -s "${json%.json}.srs" ]; then
            actual=$((actual + 1))
          else
            echo "::warning::${json} 没有对应的 srs，不计入成功"
          fi
        done
        echo "expected=$expected actual=$actual"
        ls -la ./rule/

        if [ "$actual" -eq 0 ]; then
          echo "::error::没有生成任何规则文件，中止发布"
          exit 1
        fi

        # 有上游挂掉时只上传、不做陈旧资产清理，避免把订阅中的 srs 删掉
        if [ "$actual" -lt "$expected" ]; then
          echo "::warning::只生成了 $actual/$expected 个规则，疑似上游源不可用；本次跳过陈旧资产清理"
          echo "PRUNE_STALE=false" >> "$GITHUB_ENV"
        else
          echo "PRUNE_STALE=true" >> "$GITHUB_ENV"
        fi

    - name: Publish to rolling release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail

        # 1. release 不存在则创建（tag 指向当前 commit）
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Rule sets (rolling)" \
            --notes "自动生成的 sing-box 规则集，每次构建覆盖。" \
            --latest
        fi

        # 2. 先上传新文件（--clobber 覆盖同名资产），保证链接不断流
        gh release upload "$RELEASE_TAG" ./rule/* --clobber

        # 3. 再删除本次没有生成的陈旧资产（links.txt 里已移除的规则）
        #    仅在本次生成完整时执行，否则上游临时故障会误删订阅中的资产
        if [ "${PRUNE_STALE:-false}" = "true" ]; then
          find ./rule -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/current.txt"
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' | sort > "$RUNNER_TEMP/remote.txt"
          comm -13 "$RUNNER_TEMP/current.txt" "$RUNNER_TEMP/remote.txt" > "$RUNNER_TEMP/stale.txt"
          while read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting stale asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done < "$RUNNER_TEMP/stale.txt"
        else
          echo "跳过陈旧资产清理"
        fi

        # 4. 刷新发布说明里的时间戳
        #    注意：下面每一行都必须保持缩进，
        #    顶到第 0 列会提前终止 run: | 的块标量
        {
          echo "自动生成的 sing-box 规则集，每次构建覆盖。"
          echo
          echo "最后更新: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          echo "来源提交: $GITHUB_SHA"
        } > "$RUNNER_TEMP/notes.md"
        gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
