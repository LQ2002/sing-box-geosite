name: Config Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# 只需要写 rule 分支，不往 main 推提交，也不再发 Releases
permissions:
  contents: write

env:
  RULE_BRANCH: rule

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: "Setup sing-box"
      run: |
        set -Eeuo pipefail
        # 从 GitHub Releases API 获取最新 release 中的 linux_amd64 .deb 下载链接
        SING_BOX_DEB_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
          | grep "browser_download_url" | grep "linux_amd64.deb" | head -n1 | cut -d '"' -f4 || true)
        if [ -z "$SING_BOX_DEB_URL" ]; then
          echo "::error::没有从 sing-box 最新 release 里找到 linux_amd64 的 .deb"
          exit 1
        fi
        echo "Downloading $SING_BOX_DEB_URL"
        wget -O sing-box.deb "$SING_BOX_DEB_URL"
        sudo dpkg -i sing-box.deb

    - name: Set up Python3
      uses: actions/setup-python@v6
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    - name: Prepare directories
      run: mkdir -p ./rule/

    - name: Run script
      env:
        # 主程序把"本次应该产出哪些规则集"的清单写到这里，
        # 下一步据此判断本次生成是否完整
        BUILD_REPORT: ${{ runner.temp }}/build-report.json
      run: python ../main.py
      working-directory: ./rule/

    - name: Sanity check generated files
      run: |
        set -Eeuo pipefail
        report="$RUNNER_TEMP/build-report.json"
        if [ ! -s "$report" ]; then
          echo "::error::主程序没有写出构建清单 $report"
          exit 1
        fi

        python3 .github/scripts/check_build.py "$report" ./rule "$RUNNER_TEMP/counts.txt"

        read -r expected actual < "$RUNNER_TEMP/counts.txt"
        ls -la ./rule/

        if [ "$actual" -eq 0 ]; then
          echo "::error::没有生成任何规则文件，中止发布"
          exit 1
        fi

        # 生成不完整时只做"只增不删"的发布，避免把订阅里还在用的文件抹掉
        if [ "$actual" -lt "$expected" ]; then
          echo "::warning::只生成了 $actual/$expected 个规则，疑似上游源不可用"
          echo "COMPLETE=false" >> "$GITHUB_ENV"
        else
          echo "COMPLETE=true" >> "$GITHUB_ENV"
        fi

    - name: Publish to rule branch
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail

        # rule 分支每次都是全量强制覆盖，只有一个提交。
        # 正因为是覆盖，本次生成不完整时不能直接推：
        # 缺的文件会直接从分支上消失，订阅立刻 404。
        # 所以缺的那几个从上一版快照里补回来（沿用旧版本），其余照常更新。
        restored=""
        if [ "${COMPLETE:-false}" != "true" ]; then
          prev="$RUNNER_TEMP/rulebranch-prev"
          rm -rf "$prev"
          if ! git clone -q --depth 1 -b "$RULE_BRANCH" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$prev"; then
            echo "::error::拿不到上一版 $RULE_BRANCH 分支，无法补齐缺失文件，跳过发布"
            exit 1
          fi

          # 以 srs 为准成对补：新产物里 json/srs 不齐（或为空）的，整对用旧的覆盖，
          # 免得出现新 json 配旧 srs 的混搭
          for old_srs in "$prev"/*.srs; do
            [ -e "$old_srs" ] || continue
            base=$(basename "$old_srs" .srs)
            if [ -s "./rule/$base.json" ] && [ -s "./rule/$base.srs" ]; then
              continue
            fi
            cp -f "$old_srs" "./rule/$base.srs"
            if [ -f "$prev/$base.json" ]; then
              cp -f "$prev/$base.json" "./rule/$base.json"
            else
              rm -f "./rule/$base.json"
            fi
            restored="$restored $base"
          done
          echo "::warning::本次生成不完整，以下规则沿用上一版:${restored:- (上一版里也没有)}"
        fi

        # 用算术偏移而不是 TZ=Asia/Shanghai：不依赖运行环境装了 tzdata
        stamp=$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S')
        work="$RUNNER_TEMP/rulebranch"
        rm -rf "$work"
        mkdir -p "$work"
        cp -a ./rule/. "$work/"

        {
          echo "# 规则集产物"
          echo
          echo "本分支由 CI 自动生成并**强制覆盖**，永远只有一个提交，请勿在此提交内容。"
          echo "规则来源和生成脚本在 main 分支。"
          echo
          echo '```'
          echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RULE_BRANCH/<名称>.srs"
          echo '```'
          echo
          echo "最后更新: $stamp UTC+8"
          echo
          echo "来源提交: $GITHUB_SHA"
          if [ -n "$restored" ]; then
            echo
            echo "本次上游源不可用、沿用上一版的规则:$restored"
          fi
        } > "$work/README.md"

        cd "$work"
        git init -q
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add -A
        git commit -q -m "规则集 $stamp UTC+8"
        git push -f -q \
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "HEAD:refs/heads/$RULE_BRANCH"
        echo "已强制覆盖分支 $RULE_BRANCH（$(ls -1 | wc -l) 个文件）"

    # 不完整时上面照样发布了（缺的沿用旧版），但任务要标红，
    # 否则上游源挂了也是一片绿，没人会发现
    - name: Fail if build was incomplete
      if: env.COMPLETE != 'true'
      run: |
        echo "::error::本次有规则生成失败，已沿用上一版发布，请检查上游源"
        exit 1
